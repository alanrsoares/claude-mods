# Assigns every new PR to the repo owner. pull_request_target gives the token
# write access on fork PRs; the job checks out no code, so that is safe.
name: Assign

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-assignee alanrsoares
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
