# release-please keeps a release PR open for mods with changes since their last
# tag. Merging it bumps each mod's plugin.json and marketplace.json entry,
# writes its changelog and tags <mod>-v<version>. Installed plugins update only
# when that version changes.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # PRs opened with GITHUB_TOKEN do not trigger assign.yml, so assign here.
      - if: steps.rp.outputs.prs != ''
        run: jq -r '.[].number' <<<"$PRS" | xargs -I{} gh pr edit {} --repo "$GITHUB_REPOSITORY" --add-assignee alanrsoares
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.rp.outputs.prs }}
